# Preparazione della linea di costa (SPEC §7.2): scarica i land polygons OpenStreetMap, ritaglia sull'area
# dell'app, unisce, semplifica (~20 m) e divide in tasselli 1°×1° in data/coastline/, poi li salva sul ramo.
# Non fa parte dell'app: si avvia a mano (Actions → Linea di costa → Run workflow) o con un push che
# modifica gli strumenti in tools/coastline/.
name: Linea di costa

on:
  workflow_dispatch:
    inputs:
      tolerance_m:
        description: Tolleranza di semplificazione (m)
        default: '20'
  push:
    paths:
      - tools/coastline/**
      - .github/workflows/coastline.yml

permissions:
  contents: write

concurrency:
  group: coastline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti (GDAL, shapely)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin unzip osmium-tool
          python3 -m pip install --quiet 'shapely>=2,<3'

      - name: Land polygons OpenStreetMap (osmdata, se raggiungibile)
        id: osmdata
        continue-on-error: true
        run: |
          curl -fsSL --retry 2 --connect-timeout 30 -o land.zip https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip
          unzip -q land.zip
          ogr2ogr -f GeoJSON -spat 11.8 39.6 19.9 46.0 -clipsrc 11.8 39.6 19.9 46.0 \
            -lco COORDINATE_PRECISION=7 land.geojson land-polygons-split-4326/land_polygons.shp
          echo "Fonte: land polygons osmdata" | tee source.txt

      - name: In alternativa, linee di costa dagli estratti Geofabrik (natural=coastline)
        id: geofabrik
        if: steps.osmdata.outcome != 'success'
        continue-on-error: true
        run: |
          # Paesi e regioni affacciati sull'area (estratti con vie complete); solo le vie di costa.
          mkdir -p gf
          for r in europe/italy/nord-est europe/italy/centro europe/italy/sud europe/slovenia europe/croatia \
                   europe/bosnia-herzegovina europe/montenegro europe/albania; do
            f="gf/$(basename "$r").osm.pbf"
            curl -fsSL --retry 3 --connect-timeout 30 -o "$f" "https://download.geofabrik.de/${r}-latest.osm.pbf"
            osmium tags-filter --overwrite -o "gf/coast-$(basename "$r").osm.pbf" "$f" w/natural=coastline
            rm -f "$f"
          done
          osmium merge --overwrite -o coast.osm.pbf gf/coast-*.osm.pbf
          # Linee nell'ordine dei nodi (il verso dice da che parte è la terra); anche le vie chiuse (isole).
          osmium export --overwrite -f geojson --geometry-types=linestring -o coast-lines.geojson coast.osm.pbf
          python3 tools/coastline/land-from-coastline.py coast-lines.geojson land.geojson 11.8 39.6 19.9 46.0
          echo "Fonte: vie natural=coastline OSM dagli estratti Geofabrik ($(date -u +%Y-%m-%d))" | tee source.txt

      - name: Ultima alternativa, linee di costa da Overpass (natural=coastline)
        if: steps.osmdata.outcome != 'success' && steps.geofabrik.outcome != 'success'
        env:
          UA: meteo-adriatico-coastline/1.0 (+https://github.com/pompiliipierluigi-byte/meteo)
        run: |
          # Richieste a blocchi (lat 1° × lon 2°) per non superare i limiti dei server; vie unite dopo.
          mkdir -p osm
          fetch() {
            local bbox="$1" out="$2"
            local q="[out:xml][timeout:180];way[\"natural\"=\"coastline\"]($bbox);(._;>;);out body;"
            for api in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              if curl -fsS -A "$UA" --connect-timeout 30 --max-time 200 -o "$out" --data-urlencode "data=$q" "$api" && grep -q '<osm' "$out"; then
                echo "  $bbox: $(grep -c '<way' "$out") vie da $api"
                return 0
              fi
              sleep 5
            done
            return 1
          }
          for lat in 39 40 41 42 43 44 45; do
            for lon in 11 13 15 17 19; do
              s=$(python3 -c "print(max($lat, 39.6))"); n=$(python3 -c "print(min($lat + 1, 46.0))")
              w=$(python3 -c "print(max($lon, 11.8))"); e=$(python3 -c "print(min($lon + 2, 19.9))")
              fetch "$s,$w,$n,$e" "osm/${lat}_${lon}.osm"
              sleep 2
            done
          done
          for f in osm/*.osm; do osmium sort --overwrite -o "$f.pbf" "$f"; done
          osmium merge --overwrite -o coast.osm.pbf osm/*.osm.pbf
          osmium export --overwrite -f geojson --geometry-types=linestring -o coast-lines.geojson coast.osm.pbf
          python3 tools/coastline/land-from-coastline.py coast-lines.geojson land.geojson 11.8 39.6 19.9 46.0
          echo "Fonte: vie natural=coastline OSM via Overpass ($(date -u +%Y-%m-%d))" | tee source.txt

      - name: Tasselli
        run: |
          rm -f data/coastline/*.geojson
          python3 tools/coastline/make-tiles.py land.geojson data/coastline "${{ github.event.inputs.tolerance_m || '20' }}"
          du -sh data/coastline
          for f in data/coastline/*.geojson; do printf '%8d %8d %s\n' "$(wc -c < "$f")" "$(gzip -c "$f" | wc -c)" "$f"; done | sort -n | tail -8

      - name: Salvataggio sul ramo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/coastline
          if git diff --cached --quiet; then
            echo 'Nessuna modifica ai tasselli'
            exit 0
          fi
          git commit -m "Fase 3.1: tasselli linea di costa OSM (generati da .github/workflows/coastline.yml)" -m "$(cat source.txt)"
          # Il ramo può aver ricevuto altri commit durante l'esecuzione.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
